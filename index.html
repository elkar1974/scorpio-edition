<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAU•SCORPIO•EDITION</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scorpio Edition">
    <link rel="apple-touch-icon" href="icona_ios.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; 
            background-image: url('logo_scorpio.png');
            background-size: cover; background-position: center;
            background-repeat: no-repeat; background-attachment: fixed;
            background-color: #000; color: #ffffff; text-align: center; 
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); z-index: 0;
        }
        @keyframes ingressoMorbido {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { 
            padding: 20px; 
            position: relative; 
            z-index: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            animation: ingressoMorbido 1s ease-out;
        }
        
        @keyframes fluttuazione {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }

        .logo-main { 
            width: 80vw; 
            max-width: 400px; 
            height: auto; 
            margin-bottom: 20px; 
            animation: fluttuazione 4s ease-in-out infinite; 
        }
        
        .lang-switcher { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; justify-content: center; }
        .lang-switcher a img { 
            width: 55px; 
            height: 55px; 
            object-fit: cover; 
            border: 2px solid #333; 
            border-radius: 50%; 
            transition: all 0.3s ease; 
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8); 
        }
        @media (hover: hover) {
            .lang-switcher a:hover img { 
                transform: scale(1.15) translateY(-5px); 
                border-color: #ffcc00; 
                box-shadow: 0 8px 15px rgba(255, 204, 0, 0.5); 
            }
        }
        
        .lang-switcher a:active img {
            transform: scale(0.95);
            border-color: #ffcc00; 
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            cursor: default;
        }
        .profile-nick {
            color: #ffcc00;
            font-size: 1.5em;
            letter-spacing: 3px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        @keyframes respiro {
            0% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 5px rgba(255, 204, 0, 0.3); }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 20px rgba(255, 204, 0, 0.9); }
            100% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 5px rgba(255, 204, 0, 0.3); }
        }

        .welcome-text {
            margin-top: 35px; 
            color: #ffcc00; 
            font-size: 1.5em; 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            font-weight: bold;
            animation: respiro 3s infinite ease-in-out; 
            cursor: default;
        }
        .contatore-brani {
            margin-top: 10px;
            color: #aaaaaa;
            font-size: 0.9em;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .contatore-brani span {
            color: #ffcc00;
            font-weight: 800;
            font-size: 1.2em;
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo_scorpio.png" class="logo-main" alt="MAU•SCORPIO•EDITION">
        
        <div class="profile-info">
            <div class="profile-nick">MAU•SCORPIO•EDITION</div>
        </div>

        <div class="lang-switcher">
            <a onclick="window.location.href='catalogo.html?lang=it#menu1'"><img src="https://flagcdn.com/w40/it.png" alt="Italiano"></a>
            <a onclick="window.location.href='catalogo.html?lang=es#menu1'"><img src="https://flagcdn.com/w40/es.png" alt="Español"></a>
            <a onclick="window.location.href='catalogo.html?lang=en#menu1'"><img src="https://flagcdn.com/w40/gb.png" alt="English"></a>
            <a onclick="window.location.href='catalogo.html?lang=fr#menu1'"><img src="https://flagcdn.com/w40/fr.png" alt="Français"></a>
            <a onclick="window.location.href='catalogo.html?lang=de#menu1'"><img src="https://flagcdn.com/w40/de.png" alt="Deutsch"></a>
        </div>
        <div class="welcome-text">WELCOME</div>
        <div id="contatore-brani" class="contatore-brani">Oltre <span>13.200</span> basi ufficiali disponibili</div>
    </div>

    <script>
        sessionStorage.setItem('app_started', '1');

        async function contaBasi() {
            try {
                const response = await fetch('scorpio_database.json?v=' + new Date().getTime(), { cache: 'no-store' });
                if (response.ok) {
                    const data = await response.json();
                    
                    const basiKaraoke = data.filter(b => b.categoria === 'KARAOKE');
                    const reale = basiKaraoke.length; 
                    
                    const arrotondato = Math.floor(reale / 100) * 100;
                    
                    document.getElementById('contatore-brani').innerHTML = `Oltre <span>${arrotondato.toLocaleString('it-IT')}</span> basi ufficiali disponibili`;
                }
            } catch (error) {
                document.getElementById('contatore-brani').innerHTML = `Oltre <span>13.200</span> basi ufficiali disponibili`;
            }
        }
        contaBasi();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch((err) => console.error('Errore Service Worker index:', err));
            });
        }
    </script>
</body>
</html>
