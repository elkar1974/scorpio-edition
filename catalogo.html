<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAU•SCORPIO•EDITION | Piattaforma Ufficiale</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scorpio Edition">
    <link rel="apple-touch-icon" href="logo_scorpio.png">
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; background-image: url('logo_scorpio.png'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; background-color: #000; color: #fff; min-height: 100vh; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); z-index: -1; }
        
        .navbar-fissa { position: sticky; top: 0; height: 60px; background: rgba(13, 13, 13, 0.98); z-index: 1000; border-bottom: 2px solid #ffcc00; box-shadow: 0 4px 10px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 15px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .navbar-fissa::-webkit-scrollbar { display: none; }
        
        .navbar-fissa button { background: none; border: none; cursor: pointer; color: #ffffff; font-weight: bold; text-transform: uppercase; font-size: 1em; letter-spacing: 1px; padding: 10px 15px; transition: color 0.2s; border-bottom: 2px solid transparent; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
        .navbar-fissa button:hover { color: #ffcc00; }
        .navbar-fissa button.attivo { color: #ffcc00; border-bottom: 2px solid #ffcc00; }
        
        .pagina { display: none; padding: 20px; max-width: 900px; margin: auto; min-height: calc(100vh - 60px); }
        .pagina.attiva { display: block; }
        .pagina h2 { color: #ffcc00; text-transform: uppercase; font-size: 2em; margin-bottom: 20px; text-align: center;}
        .pagina h3 { color: #ffcc00; text-transform: uppercase; font-size: 1.5em; text-align: center; margin-top: 20px; margin-bottom: 20px;}
        .pagina blockquote { border-left: 4px solid #ffcc00; padding-left: 20px; font-style: italic; color: #ccc; margin: 20px 0; font-size: 1.1em; }
        .pagina ul { list-style-type: square; padding-left: 20px; }
        .pagina li { margin-bottom: 10px; color: #ddd; }
        .pagina p { line-height: 1.6; color: #eee; }
        
        .sticky-header { position: sticky; top: 62px; background: rgba(0, 0, 0, 0.95); z-index: 990; padding: 15px 0; border-bottom: 2px solid #ffcc00; margin-bottom: 20px; }
        .search-box { width: 100%; padding: 15px; border-radius: 5px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 1.1em; box-sizing: border-box; margin-top: 10px; }
        
        .track-item { display: grid; grid-template-columns: 1fr 2fr 100px 100px; align-items: center; gap: 15px; padding: 14px; border-bottom: 1px solid #333; background: rgba(0, 0, 0, 0.6); margin-bottom: 5px; border-radius: 4px; }
        .artist-col { text-align: left; color: #ffcc00; font-size: 0.95em; text-transform: uppercase; font-weight: bold; border-right: 1px solid #444; padding-right: 10px; }
        .title-col { text-align: center; color: #ffffff; font-weight: bold; font-size: 1.1em; }
        .copy-btn { background: #ffcc00; border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 3px; color: #000; text-transform: uppercase; font-size: 0.9em; width: 100%; text-align: center; }
        
        .share-btn { background: transparent; border: 2px solid #25D366; padding: 8px; cursor: pointer; font-weight: bold; border-radius: 3px; color: #25D366; text-transform: uppercase; font-size: 0.9em; width: 100%; text-align: center; box-sizing: border-box; transition: background 0.2s; }
        .share-btn:hover { background: rgba(37, 211, 102, 0.15); }
        
        .news-filter-btn { background: transparent; border: 1px solid #ffcc00; color: #ffcc00; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 0.85em; text-transform: uppercase; transition: all 0.2s; }
        .news-filter-btn:hover { background: rgba(255, 204, 0, 0.15); }
        .news-filter-btn.active { background: #ffcc00; color: #000; box-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }

        #backToTopBtn { position: fixed; bottom: 30px; right: 30px; display: none; z-index: 999; background: rgba(0, 0, 0, 0.8); border: 2px solid #ffcc00; color: #ffcc00; border-radius: 50%; width: 50px; height: 50px; font-size: 1.5em; cursor: pointer; transition: background 0.3s, transform 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        #backToTopBtn:hover { background: rgba(255, 204, 0, 0.2); transform: scale(1.1); }

        .hq-badge { background: linear-gradient(45deg, #ffcc00, #ff9900); color: #000; font-size: 0.65em; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 8px; vertical-align: middle; letter-spacing: 0.5px; box-shadow: 0 0 5px rgba(255,204,0,0.4); border: 1px solid #333; }
        .social-proof { color: #aaa; font-size: 0.9em; text-align: center; margin-top: 8px; margin-bottom: 5px; font-style: italic; }
        .social-proof span { color: #25D366; font-weight: bold; font-size: 1.1em; font-style: normal; }
        .vetrina-container { margin-top: 40px; background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(255, 204, 0, 0.4); border-radius: 8px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .vetrina-title { color: #ffcc00; text-align: center; font-size: 1.3em; text-transform: uppercase; margin-bottom: 20px; font-weight: bold; letter-spacing: 1px; }

        .playlist { margin-top: 20px; margin-bottom: 40px; }
        .demo-track { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #333; background: rgba(0, 0, 0, 0.6); margin-bottom: 8px; border-radius: 6px; }
        .demo-info { flex-grow: 1; text-align: left; }
        .demo-title { color: #fff; font-weight: bold; font-size: 1.2em; margin-bottom: 3px; }
        .demo-artist { color: #ffcc00; font-size: 0.9em; text-transform: uppercase; font-weight: bold; }
        .play-btn { background: transparent; border: 2px solid #ffcc00; color: #ffcc00; border-radius: 50%; width: 45px; height: 45px; font-size: 1.2em; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; padding-left: 4px; }
        .play-btn:hover { background: rgba(255, 204, 0, 0.2); transform: scale(1.05); }
        .play-btn.playing { background: #ffcc00; color: #000; padding-left: 0; font-size: 1.1em; box-shadow: 0 0 15px rgba(255, 204, 0, 0.5); }
        
        .news-tag { background: #ffcc00; color: #000; font-size: 0.75em; padding: 3px 8px; border-radius: 3px; font-weight: bold; margin-left: 10px; vertical-align: middle; }
        .messaggio-errore { color: #ff4444; text-align: center; font-weight: bold; padding: 20px; border: 1px solid #ff4444; border-radius: 5px; background: rgba(255, 0, 0, 0.1); margin-top: 20px; }
        
        @media (max-width: 600px) {
            .navbar-fissa { height: 55px; justify-content: flex-start; padding: 0 10px; }
            .navbar-fissa button { font-size: 0.85em; padding: 8px 5px; }
            .sticky-header { top: 57px; padding: 10px 0; margin-bottom: 10px; } 
            .search-box { padding: 12px; margin-top: 5px; }
            .track-item { grid-template-columns: 1fr; text-align: center; gap: 10px; }
            .artist-col { border-right: none; padding-right: 0; text-align: center; border-bottom: 1px solid #444; padding-bottom: 5px; }
            .demo-title { font-size: 1.1em; }
            #backToTopBtn { bottom: 20px; right: 20px; width: 40px; height: 40px; font-size: 1.2em; }
        }
    </style>
</head>
<body>

    <div class="navbar-fissa">
        <button id="btn1" onclick="window.cambiaPagina('menu1', this)">Scorpio Edition</button>
        <button id="btn2" onclick="window.cambiaPagina('menu2', this)">Guida</button>
        <button id="btn3" class="attivo" onclick="window.cambiaPagina('catalogo', this)">Catalogo</button>
        <button id="btn4" onclick="window.cambiaPagina('menu4', this)">Sound Check</button>
    </div>

    <div id="menu1" class="pagina">
        <div id="manifesto-content"></div>
        <div class="vetrina-container" id="vetrina-novita" style="display:none;">
            <div class="vetrina-title" id="vetrinaTitleText">🔥 Ultimi Arrivi in Studio</div>
            <div id="vetrina-list"></div>
        </div>
    </div>
    
    <div id="menu2" class="pagina"><div id="guida-content"></div></div>
    
    <div id="catalogo" class="pagina attiva">
        <div class="sticky-header">
            <h2 id="catalogo-title">Archivio Ufficiale</h2>
            <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 5px;">
                <div id="trackCount" style="color: #ffcc00; font-weight: bold; font-size: 1.1em;"></div>
                <button id="newsFilterBtn" class="news-filter-btn" onclick="window.toggleNewsFilter()">🔥 Solo Novità</button>
            </div>
            <div id="socialProofContainer" class="social-proof"></div>
            <input type="text" id="searchInput" class="search-box" placeholder="Cerca...">
        </div>

        <div id="trackList">
            <p style="text-align: center; color: #ffcc00;">Caricamento database in corso...</p>
        </div>
    </div>
    
    <div id="menu4" class="pagina">
        <h3 id="demo-title-text">Ascolta la Qualità</h3>
        <div class="playlist">
            </div>
    </div>

    <button id="backToTopBtn" onclick="window.scrollToTop()">▲</button>

    <script>
        window.cambiaPagina = function(idPagina, tastoCliccato) {
            document.querySelectorAll('.pagina').forEach(pag => pag.classList.remove('attiva'));
            document.getElementById(idPagina).classList.add('attiva');
            document.querySelectorAll('.navbar-fissa button').forEach(btn => btn.classList.remove('attivo'));
            if(tastoCliccato) tastoCliccato.classList.add('attivo');
            if(currentAudio) { currentAudio.pause(); if(currentBtn) { currentBtn.innerHTML = '▶'; currentBtn.classList.remove('playing'); } }
            window.scrollTo(0, 0);
        };

        let currentAudio = null;
        let currentBtn = null;
        window.togglePlay = function(btn, src) {
            if (currentAudio && currentAudio.src.includes(src)) {
                if (currentAudio.paused) { currentAudio.play(); btn.innerHTML = '❚❚'; btn.classList.add('playing'); } 
                else { currentAudio.pause(); btn.innerHTML = '▶'; btn.classList.remove('playing'); }
            } else {
                if (currentAudio) { currentAudio.pause(); if(currentBtn) { currentBtn.innerHTML = '▶'; currentBtn.classList.remove('playing'); } }
                currentAudio = new Audio(src); currentAudio.play(); btn.innerHTML = '❚❚'; btn.classList.add('playing'); currentBtn = btn;
                currentAudio.onended = function() { btn.innerHTML = '▶'; btn.classList.remove('playing'); };
            }
        };

        let basi = [];
        let isNewsFilterActive = false;
        let copieOggiBase = Math.floor((new Date().getHours() * 60 + new Date().getMinutes()) / 8) + 12; 
        let copieLocali = parseInt(sessionStorage.getItem('copieLocali') || '0');
        let totalCopie = copieOggiBase + copieLocali;

        function updateSocialProofCounter() {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'it';
            const testoSocial = (traduzioni[lang] && traduzioni[lang].social_proof) ? traduzioni[lang].social_proof : "⚡ Basi prelevate oggi: ";
            document.getElementById('socialProofContainer').innerHTML = `${testoSocial} <span id="counterCopieNum">${totalCopie}</span>`;
        }

        async function caricaDatabase() {
            try {
                const response = await fetch('scorpio_database.txt');
                if (!response.ok) throw new Error("File non trovato.");
                const text = await response.text();
                const righe = text.split('\n');
                basi = []; 
                for (let riga of righe) {
                    if (riga.trim() !== '') {
                        const parti = riga.split('|');
                        if (parti.length >= 3) {
                            const rawDisplay = parti[0].trim();
                            const copiaTesto = parti[1].trim(); 
                            const dataStringa = parti[2].trim();
                            let titolo = rawDisplay;
                            let artista = "Sconosciuto";
                            const match = rawDisplay.match(/\[(.*?)\]/);
                            if (match) { artista = match[1].trim(); titolo = rawDisplay.replace(`[${artista}]`, '').trim(); }
                            basi.push({ titolo: titolo, artista: artista, copiaTesto: copiaTesto, data: dataStringa });
                        }
                    }
                }
                basi.sort((a, b) => a.artista.localeCompare(b.artista) || a.titolo.localeCompare(b.titolo));
                renderVetrina();
                const params = new URLSearchParams(window.location.search);
                renderTracks(params.get('search') || '');
            } catch (error) { document.getElementById('trackList').innerHTML = `<div class="messaggio-errore">Errore database.</div>`; }
        }

        window.toggleNewsFilter = function() {
            isNewsFilterActive = !isNewsFilterActive;
            const btn = document.getElementById('newsFilterBtn');
            isNewsFilterActive ? btn.classList.add('active') : btn.classList.remove('active');
            renderTracks(document.getElementById('searchInput').value);
        };

        function renderTracks(query = "") {
            const list = document.getElementById('trackList');
            const countContainer = document.getElementById('trackCount');
            list.innerHTML = "";
            const today = new Date();
            const queryPulita = query.trim().replace(/\s+/g, ' ').toLowerCase();
            let basiFiltrate = basi.filter(b => b.titolo.toLowerCase().includes(queryPulita) || b.artista.toLowerCase().includes(queryPulita) || b.copiaTesto.toLowerCase().includes(queryPulita));

            if (isNewsFilterActive) {
                basiFiltrate = basiFiltrate.filter(b => {
                    const dateParts = b.data.split('-');
                    if(dateParts.length === 3) {
                        const bDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                        const diffDays = Math.ceil(Math.abs(today - bDate) / (1000 * 60 * 60 * 24));
                        return diffDays <= 5;
                    }
                    return false;
                });
            }

            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'it';
            const testoContatore = (traduzioni[lang] && traduzioni[lang].count_testo) ? traduzioni[lang].count_testo : "Totale basi: ";
            const testoCondividi = (traduzioni[lang] && traduzioni[lang].share_btn) ? traduzioni[lang].share_btn : "Manda";
            countContainer.innerText = `${testoContatore} ${basiFiltrate.length}`;

            if(basiFiltrate.length === 0) { list.innerHTML = "<p style='text-align:center; color:#ccc; margin-top:30px;'>Nessun risultato trovato.</p>"; return; }

            basiFiltrate.forEach(b => {
                const testoSicuro = b.copiaTesto.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const titoloSicuro = b.titolo.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const artistaSicuro = b.artista.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const div = document.createElement('div');
                div.className = 'track-item';
                div.innerHTML = `<div class="artist-col">${b.artista}</div><div class="title-col">${b.titolo} <span class="hq-badge">HQ</span></div><button class="copy-btn" onclick="window.copia('${testoSicuro}')">Copia</button><button class="share-btn" onclick="window.condividi('${titoloSicuro}')">${testoCondividi}</button>`;
                list.appendChild(div);
            });
        }

        window.copia = function(text) {
            navigator.clipboard.writeText(text);
            copieLocali++; sessionStorage.setItem('copieLocali', copieLocali); totalCopie = copieOggiBase + copieLocali;
            const counterElement = document.getElementById('counterCopieNum'); if(counterElement) counterElement.innerText = totalCopie;
            alert("✅ BASE COPIATA!");
        };

        // AGGIORNAMENTO: Manda solo il titolo
        window.condividi = function(titolo) {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'it';
            const queryRicerca = encodeURIComponent(titolo.trim());
            const baseUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
            const linkCondivisione = `${baseUrl}?lang=${lang}&search=${queryRicerca}#catalogo`;
            const messaggio = `🎵 Ehi! Ho trovato questa base nel catalogo MAU•SCORPIO•EDITION: ${titolo}\n\nCopiala per StarMaker qui:\n${linkCondivisione}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(messaggio)}`, '_blank');
        };

        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTopBtn');
            btn.style.display = (window.scrollY > 300) ? 'flex' : 'none';
        });
        window.scrollToTop = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };

        const traduzioni = {
            it: { b1: "Scorpio Edition", b2: "Guida", b3: "Catalogo", b4: "Sound Check", c_title: "Archivio Ufficiale", search_ph: "Cerca brano...", count_testo: "Totale basi: ", demo_title: "Ascolta la Qualità", share_btn: "Manda", news_btn: "🔥 Solo Novità", vetrina_title: "🔥 Ultimi Arrivi", social_proof: "⚡ Basi prelevate oggi: " },
            en: { b1: "Scorpio Edition", b2: "Guide", b3: "Catalog", b4: "Sound Check", c_title: "Official Catalog", search_ph: "Search song...", count_testo: "Total tracks: ", demo_title: "Hear the Quality", share_btn: "Share", news_btn: "🔥 Only New", vetrina_title: "🔥 Latest Arrivals", social_proof: "⚡ Tracks copied today: " },
            es: { b1: "Scorpio Edition", b2: "Guía", b3: "Catálogo", b4: "Sound Check", c_title: "Archivo Oficial", search_ph: "Buscar canción...", count_testo: "Pistas totales: ", demo_title: "Escucha la Calidad", share_btn: "Enviar", news_btn: "🔥 Solo Novedades", vetrina_title: "🔥 Últimas Llegadas", social_proof: "⚡ Pistas copiadas hoy: " },
            fr: { b1: "Scorpio Edition", b2: "Guide", b3: "Catalogue", b4: "Sound Check", c_title: "Archive Officielle", search_ph: "Rechercher...", count_testo: "Pistes totales : ", demo_title: "Écoutez la Qualité", share_btn: "Partager", news_btn: "🔥 Nouveautés", vetrina_title: "🔥 Dernières Arrivées", social_proof: "⚡ Pistes copiées : " },
            de: { b1: "Scorpio Edition", b2: "Anleitung", b3: "Katalog", b4: "Sound Check", c_title: "Offizielles Archiv", search_ph: "Song suchen...", count_testo: "Gesamte Playbacks: ", demo_title: "Hören Sie die Qualität", share_btn: "Teilen", news_btn: "🔥 Nur Neuheiten", vetrina_title: "🔥 Neueste Zugänge", social_proof: "⚡ Heute kopierte Playbacks: " }
        };

        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'it';
            const data = traduzioni[lang] || traduzioni['it'];
            document.getElementById('btn1').innerText = data.b1; document.getElementById('btn2').innerText = data.b2; document.getElementById('btn3').innerText = data.b3; document.getElementById('btn4').innerText = data.b4;
            document.getElementById('catalogo-title').innerText = data.c_title; document.getElementById('searchInput').placeholder = data.search_ph;
            document.getElementById('newsFilterBtn').innerText = data.news_btn;
            updateSocialProofCounter();
            caricaDatabase();
            if(window.location.hash) { const id = window.location.hash.substring(1); const btn = document.getElementById('btn' + id.replace('menu', '')); if(btn) window.cambiaPagina(id, btn); }
        });

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
    </script>
</body>
</html>
