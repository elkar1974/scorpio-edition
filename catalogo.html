<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAU•SCORPIO•EDITION | Piattaforma Ufficiale</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; background-image: url('logo_scorpio.png'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; background-color: #000; color: #fff; min-height: 100vh; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); z-index: -1; }
        
        .navbar-fissa { position: sticky; top: 0; min-height: 60px; background: rgba(13, 13, 13, 0.98); z-index: 1000; border-bottom: 2px solid #ffcc00; box-shadow: 0 4px 10px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 5px; flex-wrap: wrap; }
        .navbar-fissa button { background: none; border: none; cursor: pointer; color: #ffffff; font-weight: bold; text-transform: uppercase; font-size: 1em; letter-spacing: 1px; padding: 10px 15px; transition: color 0.2s; border-bottom: 2px solid transparent; font-family: inherit; white-space: nowrap; }
        .navbar-fissa button:hover { color: #ffcc00; }
        .navbar-fissa button.attivo { color: #ffcc00; border-bottom: 2px solid #ffcc00; }
        
        .pagina { display: none; padding: 20px; max-width: 900px; margin: auto; min-height: calc(100vh - 60px); }
        .pagina.attiva { display: block; }
        .pagina h2 { color: #ffcc00; text-transform: uppercase; font-size: 2em; margin-bottom: 20px; text-align: center;}
        .pagina blockquote { border-left: 4px solid #ffcc00; padding-left: 20px; font-style: italic; color: #ccc; margin: 20px 0; font-size: 1.1em; }
        .pagina ul { list-style-type: square; padding-left: 20px; }
        .pagina li { margin-bottom: 10px; color: #ddd; }
        .pagina p { line-height: 1.6; color: #eee; }
        
        /* Contenitore Sticky per titolo, contatore e ricerca */
        .sticky-header { position: sticky; top: 60px; background: rgba(0, 0, 0, 0.95); z-index: 990; padding: 15px 0; border-bottom: 2px solid #ffcc00; margin-bottom: 20px; }
        .search-box { width: 100%; padding: 15px; border-radius: 5px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 1.1em; box-sizing: border-box; margin-top: 10px; }
        
        /* Stili per l'elenco delle basi: 3 Colonne (Artista | Titolo | Bottone Copia) */
        .track-item { display: grid; grid-template-columns: 1fr 2fr 100px; align-items: center; gap: 15px; padding: 14px; border-bottom: 1px solid #333; background: rgba(0, 0, 0, 0.6); margin-bottom: 5px; border-radius: 4px; }
        .artist-col { text-align: left; color: #ffcc00; font-size: 0.95em; text-transform: uppercase; font-weight: bold; border-right: 1px solid #444; padding-right: 10px; }
        .title-col { text-align: center; color: #ffffff; font-weight: bold; font-size: 1.1em; }
        .copy-btn { background: #ffcc00; border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 3px; color: #000; text-transform: uppercase; font-size: 0.9em; width: 100%; }
        
        /* Animazione Lampeggio NEWS */
        @keyframes lampeggio {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        .news-tag { background: #ffcc00; color: #000; font-size: 0.75em; padding: 3px 8px; border-radius: 3px; font-weight: bold; margin-left: 10px; vertical-align: middle; animation: lampeggio 1.2s infinite; }
        
        .mail-btn { display: block; width: 100%; background: #ffcc00; color: #000; text-align: center; padding: 20px; font-weight: bold; cursor: pointer; border-radius: 5px; text-transform: uppercase; font-size: 1.2em; margin-top: 30px; text-decoration: none; box-sizing: border-box; }
        .mail-btn:hover { background: #e6b800; }
        
        .messaggio-errore { color: #ff4444; text-align: center; font-weight: bold; padding: 20px; border: 1px solid #ff4444; border-radius: 5px; background: rgba(255, 0, 0, 0.1); margin-top: 20px; }
        
        /* Adattamento per dispositivi mobili */
        @media (max-width: 600px) {
            .navbar-fissa { top: 0; justify-content: space-around; }
            .navbar-fissa button { font-size: 0.85em; padding: 8px 5px; }
            .sticky-header { top: auto; } /* Sui mobili il menu wrap potrebbe alterare le altezze */
            .track-item { grid-template-columns: 1fr; text-align: center; gap: 10px; }
            .artist-col { border-right: none; padding-right: 0; text-align: center; border-bottom: 1px solid #444; padding-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div class="navbar-fissa">
        <button id="btn1" onclick="window.cambiaPagina('menu1', this)">Scorpio Edition</button>
        <button id="btn2" onclick="window.cambiaPagina('menu2', this)">Guida</button>
        <button id="btn3" class="attivo" onclick="window.cambiaPagina('catalogo', this)">Catalogo</button>
        <button id="btn4" onclick="window.cambiaPagina('menu4', this)">Contatti</button>
    </div>

    <div id="menu1" class="pagina"><div id="manifesto-content"></div></div>
    <div id="menu2" class="pagina"><div id="guida-content"></div></div>
    
    <div id="catalogo" class="pagina attiva">
        <div class="sticky-header">
            <h2 id="catalogo-title">Archivio Ufficiale</h2>
            <div id="trackCount" style="text-align: center; color: #ffcc00; font-weight: bold; font-size: 1.1em; margin-bottom: 5px;"></div>
            <input type="text" id="searchInput" class="search-box" placeholder="Cerca...">
        </div>
        <div id="trackList">
            <p style="text-align: center; color: #ffcc00;">Caricamento database in corso...</p>
        </div>
    </div>
    
    <div id="menu4" class="pagina"><div id="menu4-content"></div></div>

    <script>
        // --- FUNZIONE DI NAVIGAZIONE GLOBALE E SICURA ---
        window.cambiaPagina = function(idPagina, tastoCliccato) {
            document.querySelectorAll('.pagina').forEach(pag => pag.classList.remove('attiva'));
            document.getElementById(idPagina).classList.add('attiva');
            document.querySelectorAll('.navbar-fissa button').forEach(btn => btn.classList.remove('attivo'));
            if(tastoCliccato) tastoCliccato.classList.add('attivo');
            window.scrollTo(0, 0);
        };

        let basi = [];

        // --- FUNZIONE LETTURA DEL FILE TXT CON ESTRAZIONE E ORDINAMENTO ---
        async function caricaDatabase() {
            try {
                const response = await fetch('scorpio_database.txt');
                
                if (!response.ok) {
                    throw new Error("File scorpio_database.txt non trovato.");
                }
                
                const text = await response.text();
                const righe = text.split('\n');
                
                basi = []; 
                
                for (let riga of righe) {
                    if (riga.trim() !== '') {
                        const parti = riga.split('|');
                        if (parti.length >= 3) {
                            const rawDisplay = parti[0].trim(); // Es: "1000 Traume Weit [Zimmemann] (Tornerò)"
                            const copiaTesto = parti[1].trim(); 
                            const dataStringa = parti[2].trim();
                            
                            // Estrazione Artista e Titolo dal rawDisplay
                            let titolo = rawDisplay;
                            let artista = "Sconosciuto";
                            
                            // Cerca il contenuto tra parentesi quadre ovunque si trovi per l'artista
                            const match = rawDisplay.match(/\[(.*?)\]/);
                            if (match) {
                                artista = match[1].trim();
                                // Il titolo è tutto tranne la parte dell'artista
                                titolo = rawDisplay.replace(`[${artista}]`, '').trim();
                            }

                            // Evita l'inserimento di basi identiche (Doppioni)
                            const giaEsistente = basi.some(b => b.copiaTesto.toLowerCase() === copiaTesto.toLowerCase());

                            if (!giaEsistente) {
                                basi.push({
                                    titolo: titolo,
                                    artista: artista,
                                    copiaTesto: copiaTesto,
                                    data: dataStringa
                                });
                            }
                        }
                    }
                }
                
                // Ordina l'array alfabeticamente per Artista e poi per Titolo
                basi.sort((a, b) => {
                    let cmpArtista = a.artista.localeCompare(b.artista);
                    if (cmpArtista !== 0) return cmpArtista;
                    return a.titolo.localeCompare(b.titolo);
                });

                renderTracks();
                
            } catch (error) {
                console.error("Errore:", error);
                document.getElementById('trackList').innerHTML = `
                    <div class="messaggio-errore">
                        Impossibile caricare l'archivio basi (scorpio_database.txt).<br><br>
                        Assicurati che il file sia presente e che tu stia avviando un server locale e non aprendo il file HTML direttamente.
                    </div>
                `;
            }
        }

        // --- FUNZIONE DI RICERCA E VISUALIZZAZIONE ---
        function renderTracks(query = "") {
            const list = document.getElementById('trackList');
            const countContainer = document.getElementById('trackCount');
            list.innerHTML = "";
            const today = new Date();
            
            const basiFiltrate = basi.filter(b => 
                b.titolo.toLowerCase().includes(query.toLowerCase()) || 
                b.artista.toLowerCase().includes(query.toLowerCase()) ||
                b.copiaTesto.toLowerCase().includes(query.toLowerCase())
            );

            // Aggiorna contatore
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'it';
            const testoContatore = (traduzioni[lang] && traduzioni[lang].count_testo) ? traduzioni[lang].count_testo : "Totale basi: ";
            countContainer.innerText = `${testoContatore} ${basiFiltrate.length}`;

            if(basiFiltrate.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#ccc; margin-top:30px;'>Nessuna base trovata per questa ricerca.</p>";
                return;
            }

            basiFiltrate.forEach(b => {
                const dateParts = b.data.split('-');
                let isNews = '';
                
                if(dateParts.length === 3) {
                    const bDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                    const diffTime = Math.abs(today - bDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    if(diffDays <= 5) {
                        isNews = '<span class="news-tag">NEWS</span>';
                    }
                }
                
                // Protegge i caratteri speciali per l'onclick (es: apostrofi in Nell'Universo)
                const testoSicuro = b.copiaTesto.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                
                const div = document.createElement('div');
                div.className = 'track-item';
                div.innerHTML = `
                    <div class="artist-col">${b.artista}</div>
                    <div class="title-col">${b.titolo} ${isNews}</div>
                    <button class="copy-btn" onclick="window.copia('${testoSicuro}')">Copia</button>
                `;
                list.appendChild(div);
            });
        }

        window.copia = function(text) {
            navigator.clipboard.writeText(text);
            alert("Base pronta! Hai copiato:\n" + text);
        };

        // --- DIZIONARIO TRADUZIONI ---
        const traduzioni = {
            it: { 
                b1: "Scorpio Edition", b2: "Guida", b3: "Catalogo", b4: "Contatti",
                c_title: "Archivio Ufficiale", search_ph: "Cerca brano o artista...", count_testo: "Totale basi: ",
                m_content: `<h2>MAU•SCORPIO•EDITION: La voce merita rispetto.</h2><blockquote>"Cantare su una base di qualità valorizza il canto. La tua voce merita rispetto."</blockquote><p>Questo è il principio su cui ho fondato <strong>MAU•SCORPIO•EDITION</strong>. Non mi limito a fornire file audio; metto a disposizione uno strumento di lavoro che eleva la performance artistica, garantendo la dignità tecnica che ogni cantante cerca.</p><h3>L’Eccellenza è la mia scelta</h3><p>Il panorama musicale è vasto, ma la qualità per me è una scelta imprescindibile. Copro l'intero spettro musicale, dai grandi classici alle hit contemporanee, con un unico comun denominatore: la perfezione sonora.</p><p>Seleziono e processo ogni singola base presente nel mio catalogo seguendo criteri rigorosi:</p><ul><li><strong>Qualità Studio:</strong> Non accetto compromessi. Ogni traccia che metto a disposizione è ottimizzata per offrire una dinamica chiara, definita e pronta per l'uso professionale.</li><li><strong>Precisione e Sincronizzazione:</strong> Il rispetto del tempo per me è sacro. La mia sincronizzazione è millimetrica, pensata per chi, come me, non accetta sbavature durante l'esecuzione live.</li><li><strong>Strumentazione Reale:</strong> La fedeltà all'originale non è un'opzione. Propongo solo basi che mantengono intatta la struttura timbrica originale, utilizzando suoni di strumenti reali che danno spessore e veridicità alla performance.</li></ul><h3>Un viaggio di sola andata verso la Qualità</h3><p>So bene che la differenza si sente fin dalla prima nota. È per questo che ho trasformato l'esperienza di chi usa le mie basi in un punto di non ritorno: chi sceglie <strong>MAU•SCORPIO•EDITION</strong> per le proprie esibizioni, non torna più indietro. Quando si prova la certezza di una base che non tradisce mai, che esalta ogni sfumatura della propria voce e che accompagna la performance con precisione assoluta, la ricerca di alternative diventa superflua.</p><h3>Il Valore del Passaparola</h3><p>Credo fermamente che un prodotto di qualità superiore non abbia bisogno di spinte forzate. <strong>MAU•SCORPIO•EDITION</strong> è un progetto che vive dell'esperienza diretta dei professionisti e degli appassionati. È la soddisfazione di chi trova finalmente la base perfetta, la sicurezza di chi sale sul palco sapendo di avere alle spalle un suono impeccabile, a generare quel passaparola naturale che guida altri cantanti verso il mio catalogo.</p><p><strong>MAU•SCORPIO•EDITION.</strong><br><em>Perché la tua voce è il tuo strumento più prezioso. Trattala come tale.</em></p><blockquote>"Non chiedo di credermi sulla parola. Chiedo di provare una mia base. Sarà la tua voce a convincerti, e il tuo palco a raccontare la differenza."</blockquote>`,
                g_title: "Guida al catalogo basi", 
                g_text: "<p>Questo catalogo è lo specchio ufficiale del mio lavoro su <strong>StarMaker</strong>. È progettato per essere il tuo punto di riferimento costante: ogni base che carico sulla piattaforma viene sincronizzata qui in tempo reale, garantendoti un accesso sempre aggiornato al mio intero repertorio.</p><h3>1. Come trovare la tua base</h3><p>Puoi effettuare la ricerca in modo immediato utilizzando la barra in alto. Il sistema è flessibile: puoi cercare digitando il <strong>titolo del brano</strong> o il nome dell'<strong>artista</strong>. I risultati si aggiorneranno istantaneamente mentre scrivi.</p><h3>2. Il Workflow: Dal catalogo a StarMaker</h3><p>Ho reso il passaggio tra la ricerca e l'esecuzione su StarMaker più rapido possibile. Segui questi tre passaggi:</p><ul><li><strong>Trova</strong> il brano che vuoi cantare nel catalogo.</li><li>Premi il tasto <strong>COPIA</strong>: il sistema memorizzerà automaticamente il riferimento corretto.</li><li>Apri <strong>StarMaker</strong>, vai nella barra di ricerca brani e premi <strong>INCOLLA</strong>.</li></ul><p>In questo modo non perderai tempo a digitare e avrai la certezza di trovare esattamente la base che ho curato per te.</p><h3>3. Identificare le novità</h3><p>Vuoi sapere quali basi ho appena caricato? Cerca l'etichetta <span class=\"news-tag\">NEWS</span> accanto al titolo. Questo tag indica le mie ultime pubblicazioni e rimane attivo per i primi 5 giorni, permettendoti di restare sempre aggiornato sugli ultimi arrivi nel mio archivio.</p>",
                m4_text: "<h2>Contatti</h2><p>Puoi richiedere una base personalizzata o contattarmi direttamente per qualsiasi necessità musicale. Clicca qui sotto per inviare un'email.</p>",
                m4_btn: "Invia una richiesta email"
            },
            en: { 
                b1: "Scorpio Edition", b2: "Guide", b3: "Catalog", b4: "Contacts",
                c_title: "Official Catalog", search_ph: "Search song or artist...", count_testo: "Total tracks: ",
                m_content: `<h2>MAU•SCORPIO•EDITION: Your voice deserves respect.</h2><blockquote>"Singing to a quality backing track enhances your singing. Your voice deserves respect."</blockquote><p>This is the principle upon which I founded <strong>MAU•SCORPIO•EDITION</strong>. I don't just provide audio files; I provide a tool that elevates artistic performance, ensuring the technical dignity every singer seeks.</p><h3>Excellence is my choice</h3><p>The musical landscape is vast, but quality is a non-negotiable choice for me. I cover the entire musical spectrum, from great classics to contemporary hits, with one common denominator: sonic perfection.</p><p>I select and process every single track in my catalog according to rigorous criteria:</p><ul><li><strong>Studio Quality:</strong> No compromises. Every track is optimized for clear, defined, professional dynamics.</li><li><strong>Precision and Synchronization:</strong> Timing is sacred to me. My synchronization is millimetric, designed for those who, like me, do not accept flaws during live performances.</li><li><strong>Real Instrumentation:</strong> Fidelity to the original is not an option. I offer only tracks that keep the original timbre structure intact, using real instrument sounds that give depth and authenticity to the performance.</li></ul><h3>A one-way journey towards Quality</h3><p>I know the difference is felt from the very first note. That is why I have transformed the experience of those who use my tracks into a point of no return: those who choose <strong>MAU•SCORPIO•EDITION</strong> for their performances never look back. When you experience the certainty of a track that never betrays you, that highlights every nuance of your voice and accompanies the performance with absolute precision, searching for alternatives becomes superfluous.</p><h3>The Value of Word-of-Mouth</h3><p>I firmly believe that a superior quality product does not need forced pushes. <strong>MAU•SCORPIO•EDITION</strong> is a project that thrives on the direct experience of professionals and enthusiasts. It is the satisfaction of those who finally find the perfect track, the confidence of those who take the stage knowing they have impeccable sound behind them, that generates the natural word-of-mouth that guides other singers to my catalog.</p><p><strong>MAU•SCORPIO•EDITION.</strong><br><em>Because your voice is your most precious instrument. Treat it as such.</em></p><blockquote>"I don't ask you to take my word for it. I ask you to try one of my tracks. Your voice will convince you, and your stage will tell the difference."</blockquote>`,
                g_title: "Guide to the catalog", 
                g_text: "<p>This catalog is the official reflection of my work on <strong>StarMaker</strong>. It is designed to be your constant reference point: every track I upload to the platform is synchronized here in real-time, guaranteeing you up-to-date access to my entire repertoire.</p><h3>1. How to find your track</h3><p>You can search immediately using the bar at the top. The system is flexible: you can search by typing the <strong>song title</strong> or the <strong>artist's name</strong>. The results update instantly as you type.</p><h3>2. The Workflow: From catalog to StarMaker</h3><p>I have made the transition between searching and performing on StarMaker as fast as possible. Follow these three steps:</p><ul><li><strong>Find</strong> the track you want to sing in the catalog.</li><li>Press the <strong>COPY</strong> button: the system will automatically store the correct reference.</li><li>Open <strong>StarMaker</strong>, go to the song search bar, and press <strong>PASTE</strong>.</li></ul><p>This way, you won't waste time typing and will be sure to find exactly the track I have curated for you.</p><h3>3. Identifying new releases</h3><p>Want to know which tracks I have just uploaded? Look for the <span class=\"news-tag\">NEWS</span> tag next to the title. This tag indicates my latest releases and remains active for the first 5 days, allowing you to stay updated on the latest arrivals in my archive.</p>",
                m4_text: "<h2>Contacts</h2><p>You can request a custom backing track or contact me directly for any musical need. Click below to send an email.</p>",
                m4_btn: "Send an email request"
            },
            es: { 
                b1: "Scorpio Edition", b2: "Guía", b3: "Catálogo", b4: "Contacto",
                c_title: "Archivo Oficial", search_ph: "Buscar canción o artista...", count_testo: "Pistas totales: ",
                m_content: `<h2>MAU•SCORPIO•EDITION: Tu voz merece respeto.</h2><blockquote>"Cantar sobre una base de calidad realza el canto. Tu voz merece respeto."</blockquote><p>Este es el principio sobre el cual fundé <strong>MAU•SCORPIO•EDITION</strong>. No me limito a proporcionar archivos de audio; ofrezco una herramienta de trabajo que eleva la interpretación artística, garantizando la dignidad técnica que cada cantante busca.</p><h3>La excelencia es mi elección</h3><p>El panorama musical es vasto, pero la calidad para mí es una elección imprescindible. Cubro todo el espectro musical, desde grandes clásicos hasta éxitos contemporáneos, con un denominador común: la perfección sonora.</p><p>Selecciono y proceso cada pista presente en mi catálogo siguiendo criterios rigorosos:</p><ul><li><strong>Calidad de Estudio:</strong> Sin concesiones. Cada pista está optimizada para ofrecer una dinámica clara, definida y lista para uso profesional.</li><li><strong>Precisión y Sincronización:</strong> El tiempo es sagrado para mí. Mi sincronización es milimétrica, pensada para quienes, como yo, no aceptan imperfecciones durante el directo.</li><li><strong>Instrumentación Real:</strong> La fidelidad al original no es una opción. Propongo solo bases que mantienen intacta la estructura tímbrica original, utilizando sonidos de instrumentos reales que aportan profundidad y veracidad a la interpretación.</li></ul><h3>Un viaje de ida hacia la Calidad</h3><p>Sé muy bien que la diferencia se siente desde la primera nota. Por eso he transformado la experiencia de quienes usan mis bases en un punto de no retorno: quien elige <strong>MAU•SCORPIO•EDITION</strong> para sus actuaciones, no vuelve atrás. Cuando pruebas la certeza de una base que nunca traiciona, que resalta cada matiz de tu voz y que acompaña la actuación con precisión absoluta, la búsqueda de alternativas se vuelve superflua.</p><h3>El valor del boca a boca</h3><p>Creo firmemente que un producto de calidad superior no necesita empujes forzados. <strong>MAU•SCORPIO•EDITION</strong> es un proyecto que vive de la experiencia directa de profesionales y entusiastas. Es la satisfacción de quien encuentra finalmente la base perfecta, la seguridad de quien sube al escenario sabiendo que tiene un sonido impecable, lo que genera ese boca a boca natural que guía a otros cantantes hacia mi catálogo.</p><p><strong>MAU•SCORPIO•EDITION.</strong><br><em>Porque tu voz es tu instrumento más preciado. Trátala como tal.</em></p><blockquote>"No pido que me creas. Te pido que pruebes una de mis bases. Tu voz te convencerá y tu escenario contará la diferencia."</blockquote>`,
                g_title: "Guía del catálogo de bases", 
                g_text: "<p>Este catálogo es el reflejo oficial de mi trabajo en <strong>StarMaker</strong>. Está diseñado para ser tu punto de referencia constante: cada base que subo a la plataforma se sincroniza aquí en tiempo real, garantizándote un acceso siempre actualizado a todo mi repertorio.</p><h3>1. Cómo encontrar tu base</h3><p>Puedes realizar la búsqueda de forma inmediata utilizando la barra superior. El sistema es flexible: puedes buscar escribiendo el <strong>título de la canción</strong> o el nombre del <strong>artista</strong>. Los resultados se actualizarán instantáneamente mientras escribes.</p><h3>2. El Workflow: Del catálogo a StarMaker</h3><p>He hecho que la transición entre la búsqueda y la ejecución en StarMaker sea lo más rápida posible. Sigue estos tres pasos:</p><ul><li><strong>Encuentra</strong> la canción que quieres cantar en el catálogo.</li><li>Presiona el botón <strong>COPIAR</strong>: el sistema memorizará automáticamente la referencia correcta.</li><li>Abre <strong>StarMaker</strong>, ve a la barra de búsqueda de canciones y presiona <strong>PEGAR</strong>.</li></ul><p>De esta forma, no perderás tiempo escribiendo y tendrás la certeza de encontrar exactamente la base que he preparado para ti.</p><h3>3. Identificar las novedades</h3><p>¿Quieres saber qué bases acabo de subir? Busca la etiqueta <span class=\"news-tag\">NEWS</span> junto al título. Esta etiqueta indica mis últimas publicaciones y permanece activa durante los primeros 5 días, permitiéndote estar siempre actualizado sobre las últimas llegadas a mi archivo.</p>",
                m4_text: "<h2>Contacto</h2><p>Puedes solicitar una base personalizada o contactarme directamente para cualquier necesidad musical. Haz clic abajo para enviar un correo electrónico.</p>",
                m4_btn: "Enviar una solicitud por correo"
            },
            fr: {

                m_content: `<h2>MAU•SCORPIO•EDITION : Ta voix mérite le respect.</h2><blockquote>"Chanter sur une base de qualité valorise le chant. Ta voix mérite le respect."</blockquote><p>C’est le principe sur lequel j’ai fondé <strong>MAU•SCORPIO•EDITION</strong>. Je ne me limite pas à fournir des fichiers audio ; je mets à disposition un outil de travail qui élève la performance artistique, garantissant la dignité technique que chaque chanteur recherche.</p><h3>L’Excellence est mon choix</h3><p>Le paysage musical est vaste, mais la qualité pour moi est un choix incontournable. Je couvre tout le spectre musical, des grands classiques aux hits contemporains, avec un seul dénominateur commun : la perfection sonore.</p><p>Je sélectionne et traite chaque piste présente dans mon catalogue selon des critères rigoureux :</p><ul><li><strong>Qualité Studio :</strong> Aucun compromis. Chaque piste est optimisée pour offrir une dynamique claire, définie et prête pour un usage professionnel.</li><li><strong>Précision et Synchronisation :</strong> Le temps est sacré pour moi. Ma synchronisation est millimétrée, conçue pour ceux qui, comme moi, n'acceptent aucune imperfection lors d'une performance live.</li><li><strong>Instrumentation Réelle :</strong> La fidélité à l'original n'est pas une option. Je propose uniquement des bases qui conservent intacte la structure timbale originale, en utilisant des sons d'instruments réels qui donnent de la profondeur et de la véracité à la performance.</li></ul><h3>Un voyage sans retour vers la Qualité</h3><p>Je sais très bien que la différence se sent dès la première note. C’est pourquoi j’ai transformé l’expérience de ceux qui utilisent mes bases en un point de non-retour : quiconque choisit <strong>MAU•SCORPIO•EDITION</strong> pour ses prestations ne revient jamais en arrière. Lorsque l'on goûte à la certitude d'une base qui ne trahit jamais, qui met en valeur chaque nuance de sa voix et qui accompagne la prestation avec une précision absolue, la recherche d'alternatives devient superflue.</p><h3>La valeur du bouche-à-oreille</h3><p>Je crois fermement qu’un produit de qualité supérieure n’a pas besoin de poussées forcées. <strong>MAU•SCORPIO•EDITION</strong> est un projet qui vit de l'expérience directe des professionnels et des passionnés. C’est la satisfaction de celui qui trouve enfin la base parfaite, la sécurité de celui qui monte sur scène en sachant qu’il a un son impeccable derrière lui, qui génère ce bouche-à-oreille naturel qui guide d'autres chanteurs vers mon catalogue.</p><p><strong>MAU•SCORPIO•EDITION.</strong><br><em>Parce que ta voix est ton instrument le plus précieux. Traite-la comme tel.</em></p><blockquote>"Je ne demande pas de me croire sur parole. Je demande d'essayer l'une de mes bases. Ta voix te convaincra, et ta scène racontera la différence."</blockquote>`,
                g_title: "Guide du catalogue des bases", 
                g_text: "<p>Ce catalogue est le reflet officiel de mon travail sur <strong>StarMaker</strong>. Il est conçu pour être ton point de référence constant : chaque base que je téléverse sur la plateforme est synchronisée ici en temps réel, te garantissant un accès toujours mis à jour à tout mon répertoire.</p><h3>1. Comment trouver ta base</h3><p>Tu peux effectuer la recherche immédiatement en utilisant la barre en haut. Le système est flexible : tu peux chercher en tapant le <strong>titre de la chanson</strong> ou le nom de l'<strong>artiste</strong>. Les résultats se mettront à jour instantanément pendant que tu écris.</p><h3>2. Le Workflow : Du catalogue à StarMaker</h3><p>J'ai rendu la transition entre la recherche et l'exécution sur StarMaker la plus rapide possible. Suis ces trois étapes :</p><ul><li><strong>Trouve</strong> la chanson que tu veux chanter dans le catalogue.</li><li>Appuie sur le bouton <strong>COPIER</strong> : le système mémorisera automatiquement la référence correcte.</li><li>Ouvre <strong>StarMaker</strong>, va dans la barre de recherche des chansons et appuie sur <strong>COLLER</strong>.</li></ul><p>De cette façon, tu ne perdras pas de temps à taper et tu auras la certitude de trouver exactement la base que j'ai préparée pour toi.</p><h3>3. Identifier les nouveautés</h3><p>Tu veux savoir quelles bases je viens de téléverser ? Cherche l'étiquette <span class=\"news-tag\">NEWS</span> à côté du titre. Cette étiquette indique mes dernières publications et reste active pendant les 5 premiers jours, te permettant de rester toujours au courant des dernières arrivées dans mon archive.</p>",

                m_content: `<h2>MAU•SCORPIO•EDITION: Deine Stimme verdient Respekt.</h2><blockquote>"Auf einem hochwertigen Playback zu singen, wertet den Gesang auf. Deine Stimme verdient Respekt."</blockquote><p>Dies ist das Prinzip, auf dem ich <strong>MAU•SCORPIO•EDITION</strong> gegründet habe. Ich liefere nicht nur Audiodateien; ich stelle ein Arbeitswerkzeug zur Verfügung, das die künstlerische Darbietung hebt und die technische Qualität garantiert, die jeder Sänger sucht.</p><h3>Exzellenz ist meine Wahl</h3><p>Die Musiklandschaft ist riesig, aber Qualität ist für mich eine unverzichtbare Wahl. Ich decke das gesamte Musikspektrum ab, von großen Klassikern bis hin zu zeitgenössischen Hits, mit einem gemeinsamen Nenner: klangliche Perfektion.</p><p>Ich wähle und bearbeite jeden einzelnen Titel in meinem Katalog nach strengen Kriterien:</p><ul><li><strong>Studioqualität:</strong> Keine Kompromisse. Jeder Titel ist optimiert, um eine klare, definierte Dynamik zu bieten, die für den professionellen Einsatz bereit ist.</li><li><strong>Präzision und Synchronisation:</strong> Das Timing ist mir heilig. Meine Synchronisation ist millimetergenau – konzipiert für alle, die, genau wie ich, während eines Live-Auftritts keine Unsauberkeiten akzeptieren.</li><li><strong>Echte Instrumentierung:</strong> Die Originaltreue ist keine Option, sondern Standard. Ich biete nur Playbacks an, die die ursprüngliche Klangstruktur bewahren und echte Instrumentenklänge verwenden, die der Darbietung Tiefe und Authentizität verleihen.</li></ul><h3>Eine Reise ohne Rückkehr zur Qualität</h3><p>Ich weiß sehr gut, dass man den Unterschied ab der ersten Note hört. Deshalb habe ich die Erfahrung derjenigen, die meine Playbacks nutzen, in einen Punkt ohne Wiederkehr verwandelt: Wer sich für <strong>MAU•SCORPIO•EDITION</strong> für seine Auftritte entscheidet, geht nie wieder zurück. Wenn man die Gewissheit eines Playbacks spürt, das einen nie im Stich lässt, das jede Nuance der Stimme hervorhebt und die Performance mit absoluter Präzision begleitet, wird die Suche nach Alternativen überflüssig.</p><h3>Der Wert der Mundpropaganda</h3><p>Ich glaube fest daran, dass ein Produkt von überlegener Qualität keine erzwungene Werbung braucht. <strong>MAU•SCORPIO•EDITION</strong> ist ein Projekt, das von der direkten Erfahrung der Profis und Enthusiasten lebt. Es ist die Zufriedenheit derer, die endlich das perfekte Playback finden, und die Sicherheit derer, die auf die Bühne gehen und wissen, dass sie einen tadellosen Sound im Rücken haben, die die natürliche Mundpropaganda erzeugt, die andere Sänger zu meinem Katalog führt.</p><p><strong>MAU•SCORPIO•EDITION.</strong><br><em>Weil deine Stimme dein wertvollstes Instrument ist. Behandle sie auch so.</em></p><blockquote>"Ich verlange nicht, dass du mir beim Wort glaubst. Probiere eines meiner Playbacks aus. Deine Stimme wird dich überzeugen, und deine Bühne wird den Unterschied erzählen."</blockquote>`,
                g_title: "Anleitung zum Playback-Katalog", 
                g_text: "<p>Dieser Katalog ist das offizielle Abbild meiner Arbeit auf <strong>StarMaker</strong>. Er ist darauf ausgelegt, dein ständiger Bezugspunkt zu sein: Jedes Playback, das ich auf die Plattform hochlade, wird hier in Echtzeit synchronisiert, was dir einen stets aktuellen Zugriff auf mein gesamtes Repertoire garantiert.</p><h3>1. So findest du dein Playback</h3><p>Du kannst die Suche sofort über die Leiste oben nutzen. Das System ist flexibel: Du kannst suchen, indem du den <strong>Songtitel</strong> oder den Namen des <strong>Künstlers</strong> eingibst. Die Ergebnisse aktualisieren sich sofort, während du tippst.</p><h3>2. Der Workflow: Vom Katalog zu StarMaker</h3><p>Ich habe den Übergang zwischen der Suche und der Ausführung auf StarMaker so schnell wie möglich gestaltet. Folge diesen drei Schritten:</p><ul><li><strong>Finde</strong> den Song, den du singen möchtest, im Katalog.</li><li>Drücke den <strong>KOPIEREN</strong>-Button: Das System speichert automatisch die richtige Referenz.</li><li>Öffne <strong>StarMaker</strong>, gehe zur Song-Suchleiste und drücke <strong>EINFÜGEN</strong>.</li></ul><p>Auf diese Weise verschwendest du keine Zeit mit Tippen und hast die Gewissheit, genau das Playback zu finden, das ich für dich kuratiert habe.</p><h3>3. Neuheiten identifizieren</h3><p>Möchtest du wissen, welche Playbacks ich gerade hochgeladen habe? Suche nach dem <span class=\"news-tag\">NEWS</span>-Tag neben dem Titel. Dieser Tag zeigt meine neuesten Veröffentlichungen an und bleibt für die ersten 5 Tage aktiv, sodass du immer über die neuesten Zugänge in meinem Archiv informiert bleibst.</p>",
