        /* ========================================== */

        /* ========================================== */
        #testo-qr, 
        img[alt="WhatsApp QR Code"], 
        a[href*="wa.me"], 
        a[href*="wa.me"] + p,
        div[style*="margin-top: 30px"] p:has(+ a[href*="wa.me"]) {

        }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); z-index: -1; }
        
        .navbar-fissa { 
    position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; height: 60px; 
    background: rgba(10, 10, 10, 0.75); 
    backdrop-filter: blur(15px); 
    -webkit-backdrop-filter: blur(15px); 
    z-index: 1000; border-bottom: 2px solid #ffcc00; box-shadow: 0 4px 10px rgba(0,0,0,0.8); 
    display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 15px; 
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; 
}
        .navbar-fissa::-webkit-scrollbar { display: none; }
        
        .navbar-fissa button { background: none; border: none; cursor: pointer; color: #ffffff; font-weight: bold; text-transform: uppercase; font-size: 1em; letter-spacing: 1px; padding: 10px 15px; transition: color 0.2s; border-bottom: 2px solid transparent; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
        .navbar-fissa button:hover { color: #ffcc00; }
        .navbar-fissa button.attivo { color: #ffcc00; border-bottom: 2px solid #ffcc00; }
        
        .pagina { display: none; padding: 80px 20px 100px 20px; max-width: 900px; margin: auto; min-height: 100vh; box-sizing: border-box; }
        @keyframes comparsaMorbida {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.pagina.attiva { 
    display: block; 
    animation: comparsaMorbida 0.3s ease-out; 
}
        .pagina h2 { color: #ffcc00; text-transform: uppercase; font-size: 2em; margin-bottom: 20px; text-align: center;}
        .pagina h3 { color: #ffcc00; text-transform: uppercase; font-size: 1.5em; text-align: center; margin-top: 20px; margin-bottom: 20px;}
        .pagina blockquote { border-left: 4px solid #ffcc00; padding-left: 20px; font-style: italic; color: #ccc; margin: 20px 0; font-size: 1.1em; }
        .pagina ul { list-style-type: square; padding-left: 20px; }
        .pagina li { margin-bottom: 10px; color: #ddd; }
        .pagina p { line-height: 1.6; color: #eee; }
        
        .sticky-header { 
    position: sticky; top: 62px; 
    background: rgba(10, 10, 10, 0.75); 
    backdrop-filter: blur(15px); 
    -webkit-backdrop-filter: blur(15px); 
    z-index: 990; padding: 15px 0; border-bottom: 2px solid #ffcc00; margin-bottom: 20px; 
}
        .search-wrapper {
            position: relative;
            width: 100%;
            margin-top: 10px;
        }
        .search-box { 
            width: 100%; padding: 15px 45px 15px 15px; border-radius: 6px; 
            border: 1px solid #444; background: #1a1a1a; color: white; 
            font-size: 1.1em; box-sizing: border-box; 
            -webkit-appearance: none; outline: none; transition: all 0.3s ease; 
        }
        .search-box:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.45);
            background: #141414;
        }
        input[type="search"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-decoration {
            -webkit-appearance: none;
            display: none;
        }
        .clear-search-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: #333;
            color: #ffcc00;
            border: 1px solid #555;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .clear-search-btn:active {
            transform: translateY(-50%) scale(0.9);
            background: #444;
        }
        
        .track-item { 
    display: grid; 
    grid-template-columns: 1fr 2fr 100px 50px; 
    align-items: center; 
    gap: 15px; 
    padding: 16px; 
    background: rgba(20, 20, 20, 0.8); 
    border: 1px solid #333; 
    margin-bottom: 10px; 
    border-radius: 8px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
        
        .meta-col { display: contents; }
        
        .artist-col { text-align: left; color: #ffcc00; font-size: 0.95em; text-transform: uppercase; font-weight: bold; border-right: 1px solid #444; padding-right: 10px; }
        .title-col { text-align: center; color: #ffffff; font-weight: bold; font-size: 1.1em; }
        
        .copy-btn { 
            background: linear-gradient(135deg, #ffcc00, #ffaa00); 
            border: none; 
            padding: 10px; 
            cursor: pointer; 
            font-weight: 800; 
            border-radius: 6px; 
            color: #000; 
            text-transform: uppercase; 
            font-size: 0.9em; 
            width: 100%; 
            text-align: center;
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.2); 
        }
         
        .copy-btn:active, .share-btn:active, .filter-btn:active {
            transform: scale(0.96);
        }

        .share-btn { 
            background: linear-gradient(135deg, #ff2d55, #d90429); 
            border: none; 
            padding: 3px; 
            cursor: pointer; 
            border-radius: 6px; 
            width: 100%; 
            height: 38px;
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            box-sizing: border-box; 
            box-shadow: 0 4px 10px rgba(255, 45, 85, 0.3);
            transition: all 0.2s;
        }
        .share-btn:hover { background: linear-gradient(135deg, #e62047, #b80020); }
        .share-btn img { width: 32px; height: 32px; object-fit: contain; border-radius: 4px; display: block; }
        
        .filter-group { display: flex; justify-content: center; gap: 10px; margin-top: 10px; margin-bottom: 5px; flex-wrap: wrap; }
        .filter-btn { background: transparent; border: 1px solid #ffcc00; color: #ffcc00; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85em; text-transform: uppercase; transition: all 0.2s; }
        .filter-btn:hover { background: rgba(255, 204, 0, 0.15); }
        .filter-btn.active { background: #ffcc00; color: #000; box-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }

        #backToTopBtn { position: fixed; bottom: 30px; right: 30px; display: none; z-index: 999; background: rgba(0, 0, 0, 0.8); border: 2px solid #ffcc00; color: #ffcc00; border-radius: 50%; width: 50px; height: 50px; font-size: 1.5em; cursor: pointer; transition: background 0.3s, transform 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        #backToTopBtn:hover { background: rgba(255, 204, 0, 0.2); transform: scale(1.1); }

        .hq-badge { 
            background: linear-gradient(135deg, #ffe066, #ffaa00); 
            color: #000; 
            font-size: 0.65em; 
            padding: 3px 7px; 
            border-radius: 4px; 
            font-weight: 800; 
            margin-left: 8px; 
            vertical-align: middle; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            box-shadow: 0 2px 6px rgba(255, 170, 0, 0.45); 
            letter-spacing: 0.5px;
        }
        
        .news-tag { 
            background: linear-gradient(135deg, #ff4444, #cc0000); 
            color: #fff; 
            font-size: 0.70em; 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-weight: 800; 
            margin-left: 8px; 
            vertical-align: middle; 
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 2px 6px rgba(255, 0, 0, 0.4);
            letter-spacing: 0.5px;
        }
        
        .messaggio-errore { color: #ff4444; text-align: center; font-weight: bold; padding: 20px; border: 1px solid #ff4444; border-radius: 5px; background: rgba(255, 0, 0, 0.1); margin-top: 20px; }
        
        .copy-counter-widget { position: fixed; bottom: 30px; left: 30px; background: rgba(15, 15, 15, 0.9); border: 1px solid rgba(255, 204, 0, 0.3); color: #ccc; padding: 8px 18px; border-radius: 30px; font-size: 0.85em; z-index: 998; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 8px; backdrop-filter: blur(5px); }
        .copy-counter-widget span#copyWidgetNum { color: #ffcc00; font-weight: bold; font-size: 1.1em; letter-spacing: 0.5px; }
        .copy-counter-widget svg { width: 16px; height: 16px; fill: #ffcc00; }
        
        @keyframes pulse-gold {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
            50% { transform: scale(1.08); box-shadow: 0 0 20px rgba(255,204,0,0.8); border-color: #ffcc00; }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        }
        .pulse-anim { animation: pulse-gold 0.4s ease; }
        @keyframes pop-text {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); color: #ffffff; text-shadow: 0 0 10px #ffcc00; }
            100% { transform: scale(1); }
        }
        .pop-anim { animation: pop-text 0.3s ease-out; display: inline-block; }

        .install-app-btn {
            background: linear-gradient(135deg, #111, #222);
            color: #ffcc00;
            border: 1px solid #ffcc00;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85em;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.2);
            text-transform: uppercase;
            transition: transform 0.2s;
        }
        .install-app-btn:active { transform: scale(0.95); }
        
        .ios-install-popup {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #ffcc00;
            color: white;
            padding: 15px;
            border-radius: 12px;
            z-index: 3000;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            width: 85%;
            max-width: 320px;
        }
        .ios-install-popup .close-ios {
            position: absolute; top: 5px; right: 10px; color: #ffcc00; font-size: 1.2em; font-weight: bold; cursor: pointer;
        }
        .ios-install-popup p { margin: 10px 0; font-size: 0.9em; line-height: 1.4; }
        .ios-install-popup svg { width: 20px; height: 20px; fill: #ffcc00; vertical-align: middle; }

        @media (max-width: 600px) {
            .navbar-fissa { height: 55px; justify-content: flex-start; padding: 0 10px; }

            .sticky-header { top: 57px; padding: 10px 0; margin-bottom: 10px; } 
            .search-box { padding: 12px; margin-top: 5px; }
            
            .track-item { grid-template-columns: 1fr auto auto; text-align: left; gap: 10px; padding: 10px; width: 100%; box-sizing: border-box; }

            .title-col { text-align: left; font-size: 0.95em; line-height: 1.2; word-wrap: break-word; overflow-wrap: break-word; }
            
            .copy-btn { width: auto; padding: 10px 12px; font-size: 0.8em; height: 38px; }
            .share-btn { width: 38px; height: 38px; padding: 3px; flex-shrink: 0; }
            .share-btn img { width: 32px; height: 32px; object-fit: contain; border-radius: 4px; display: block; }
            #backToTopBtn { bottom: 20px; right: 20px; width: 45px; height: 45px; font-size: 1.3em; }
            
            .copy-counter-widget { bottom: 20px; left: 15px; padding: 6px 12px; font-size: 0.75em; }
            .copy-counter-widget svg { width: 14px; height: 14px; }
        }
        .toast-notifica {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #ffcc00;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 12px rgba(255, 204, 0, 0.3);

            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            font-size: 0.9em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s ease, opacity 0.35s ease;
            white-space: nowrap;
        }
        .toast-notifica.visibile {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        @keyframes volaNota {
            0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.6) rotate(-20deg); }
        }
        .nota-animata {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 1.8em;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.9);
            animation: volaNota 0.8s ease-out forwards;
        }
        .btn-preferito {

            border: none;
            color: #555;
            font-size: 1.5em;

            width: 100%;

        .box-richiesta input:focus, .box-richiesta textarea:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
        }
        .btn-invia-richiesta {
            width: 100%;
            background: linear-gradient(135deg, #ffcc00, #ffaa00);
            border: none;
            color: #000;
            font-weight: 800;
            font-size: 1em;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
            transition: transform 0.2s, filter 0.2s;
        }
        .btn-invia-richiesta:active { transform: scale(0.97); }
        .richiesta-esito {

            display: block;
        }
        .richiesta-esito.err {
            background: rgba(255, 68, 68, 0.15);
            border: 1px solid #ff4444;
            color: #ff4444;
            display: block;
        }
.box-highlight {
            background: linear-gradient(135deg, rgba(255, 45, 85, 0.1), rgba(217, 4, 41, 0.1));
            border: 2px solid #ff2d55;
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.2);

        .box-highlight h4 {
            color: #ff2d55;

            display: flex;
            align-items: center;

        }
        .box-highlight p { margin-bottom: 10px; font-size: 0.95em; line-height: 1.5; }

        .icon-inline { width: 18px; height: 18px; vertical-align: middle; margin: 0 4px; transform: translateY(-2px); }

            <img src="qr_whatsapp.jpg" alt="WhatsApp QR Code" style="max-width: 200px; border: 2px solid #ffcc00; border-radius: 10px; box-shadow: 0 0 15px rgba(255,204,0,0.3);">

    <div id="copyCounterWidget" class="copy-counter-widget">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>

    </div>

    <script>
        const isApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        if (isApp && !sessionStorage.getItem('app_started')) {
            sessionStorage.setItem('app_started', '1');
            window.location.replace('index.html');
        }

        window.cambiaPagina = function(idPagina, tastoCliccato) {
            document.querySelectorAll('.pagina').forEach(pag => pag.classList.remove('attiva'));
            document.getElementById(idPagina).classList.add('attiva');
            document.querySelectorAll('.navbar-fissa button').forEach(btn => btn.classList.remove('attivo'));
            if(tastoCliccato) tastoCliccato.classList.add('attivo');
            window.scrollTo(0, 0);
        };

        let basi = [];
        let isNewsFilterActive = false;
        let isFavFilterActive = false;
        let currentCategory = 'KARAOKE';
        let preferiti = JSON.parse(localStorage.getItem('scorpio_preferiti') || '[]');
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('btnInstallApp').style.display = 'inline-flex';
        });

        window.installaApp = function() {
            const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
            if (isIos) {
                document.getElementById('iosInstallPopup').style.display = 'flex';
            } else if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') {
                        document.getElementById('btnInstallApp').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        };

        if (/iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase()) && !window.navigator.standalone) {
            setTimeout(() => { 
                const btn = document.getElementById('btnInstallApp');
                if (btn) btn.style.display = 'inline-flex'; 
            }, 500);
        } 

        let baseCopiesStorage = parseInt(localStorage.getItem('scorpio_local_copies') || '0');
        
        function aggiornaContatoreCopie() {
            let timeFactor = Math.floor((Date.now() - new Date("2025-01-01").getTime()) / (1000 * 60 * 15));
            let totalCopies = 14500 + timeFactor + baseCopiesStorage;
            
            document.getElementById('copyWidgetNum').innerText = totalCopies.toLocaleString('it-IT');
            
            const widget = document.getElementById('copyCounterWidget');
            widget.classList.remove('pulse-anim');
            void widget.offsetWidth; 
            widget.classList.add('pulse-anim');
        }

        function parseScorpioDate(dateString) {
            if (!dateString) return new Date(0);
            const str = dateString.trim().replace(/\s+/g, '');
            const parti = str.split(/[-/]/);
            if (parti.length >= 3) {
                let p0 = parti[0];
                let p1 = parti[1];
                let p2 = parti[2];
                let anno = p2.length === 4 ? p2 : p0;
                let giorno = p2.length === 4 ? p0 : p2;
                return new Date(parseInt(anno, 10), parseInt(p1, 10) - 1, parseInt(giorno, 10));
            }
            return new Date(0);
        }

        async function caricaDatabase() {
            try {
                const response = await fetch('scorpio_database.json?v=' + new Date().getTime(), { cache: 'no-store' });
                
                if (!response.ok) {
                    throw new Error("File scorpio_database.json non trovato.");
                }
                
                const dataJson = await response.json();
                
                const pulisci = (t) => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ');
                
                basi = dataJson.map(b => ({
                    ...b,
                    stringaRicerca: pulisci((b.titolo || '') + ' ' + (b.artista || '') + ' ' + (b.copiaTesto || ''))
                }));
                
                basi.sort((a, b) => {
                    let cmpArtista = a.artista.localeCompare(b.artista);
                    if (cmpArtista !== 0) return cmpArtista;
                    return a.titolo.localeCompare(b.titolo);
                });

                renderVetrina();

                const params = new URLSearchParams(window.location.search);
                const searchParam = params.get('search') || '';
                if (searchParam) {
                    document.getElementById('searchInput').value = searchParam;
                }
                renderTracks(searchParam);
                
            } catch (error) {
                console.error("Errore:", error);
                document.getElementById('trackList').innerHTML = `
                    <div class="messaggio-errore">
                        Impossibile caricare l'archivio basi (scorpio_database.json).<br><br>
                        Assicurati che il file sia presente sul server o nella cartella locale.
                    </div>
                `;
            }
        }

        function renderVetrina() {
            const list = document.getElementById('vetrina-list');
            const vetrinaContainer = document.getElementById('vetrina-novita');
            
            const basiRecenti = [...basi].sort((a, b) => parseScorpioDate(b.data) - parseScorpioDate(a.data)).slice(0, 3);
            
            if(basiRecenti.length > 0) {
                vetrinaContainer.style.display = 'block';
                const params = new URLSearchParams(window.location.search);
                const lang = params.get('lang') || 'it';
                const testoCondividi = (traduzioni[lang] && traduzioni[lang].share_btn) ? traduzioni[lang].share_btn : "Manda";
                const testoCopia = (traduzioni[lang] && traduzioni[lang].copy_btn) ? traduzioni[lang].copy_btn : "Copia";

                const htmlVetrina = basiRecenti.map(b => {
                    const testoSicuro = b.copiaTesto.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                    const titoloCondivisione = b.titolo.replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '').trim().replace(/'/g, "\\'").replace(/"/g, "&quot;");
                    
                    return `
                        <div class="track-item">
                            <div class="meta-col">
                                <div class="artist-col">${b.artista}</div>
                                <div class="title-col">${b.titolo} <span class="news-tag">NEWS</span> <span class="hq-badge">HQ</span></div>
                            </div>
                            <button class="copy-btn" onclick="window.copia('${testoSicuro}')">${testoCopia}</button>
                            <button class="share-btn" onclick="window.condividi('${titoloCondivisione}')">
    <img src="starmaker.png" alt="StarMaker">
</button>
                        </div>
                    `;
                }).join('');
                
                list.innerHTML = htmlVetrina;
            }
        }

        window.setCategory = function(cat) {
            currentCategory = cat;
            document.getElementById('btnCatKaraoke').classList.toggle('active', cat === 'KARAOKE');
            document.getElementById('btnCatBasiInediti').classList.toggle('active', cat === 'BASI_INEDITI');
            
            // Gestione Banner
            const banner = document.getElementById('bannerIneditiYouTube');
            if (cat === 'BASI_INEDITI') {
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
            
            renderTracks(document.getElementById('cerca').value);
        };

        window.setFilter = function(isNews) {
            isNewsFilterActive = isNews;
            if(isNews) {
                document.getElementById('btnFilterNews').classList.add('active');
                document.getElementById('btnFilterAll').classList.remove('active');
            } else {
                document.getElementById('btnFilterNews').classList.remove('active');
                document.getElementById('btnFilterAll').classList.add('active');
            }
            renderTracks(document.getElementById('cerca').value);
        };

        function gestisciInputRicerca() {
            const input = document.getElementById('cerca');
            const btnClear = document.getElementById('clearSearchBtn');
            btnClear.style.display = input.value.length > 0 ? 'flex' : 'none';
            renderTracks(input.value);
        }

        function svuotaRicerca() {
            const input = document.getElementById('cerca');
            const btnClear = document.getElementById('clearSearchBtn');
            input.value = '';
            btnClear.style.display = 'none';
            input.focus();
            renderTracks('');
        }

        window.setFilterFav = function() {
            isFavFilterActive = !isFavFilterActive;
            isNewsFilterActive = false;
            
            document.getElementById('btnFilterFav').classList.toggle('active', isFavFilterActive);
            
            if(isFavFilterActive) {
                document.getElementById('btnFilterAll').classList.remove('active');
                document.getElementById('btnFilterNews').classList.remove('active');
            } else {
                document.getElementById('btnFilterAll').classList.add('active');
            }
            renderTracks(document.getElementById('cerca').value);
        };

        window.toggleFav = function(idBrano) {
            const index = preferiti.indexOf(idBrano);
            if (index > -1) {
                preferiti.splice(index, 1);
            } else {
                preferiti.push(idBrano);
            }
            localStorage.setItem('scorpio_preferiti', JSON.stringify(preferiti));
            aggiornaContatoreFav();
            renderTracks(document.getElementById('cerca').value);
        };

        function aggiornaContatoreFav() {
            const favCountSpan = document.getElementById('favCount');
            if(favCountSpan) favCountSpan.innerText = `(${preferiti.length})`;
        }

        function renderTracks(query = "") {
            const list = document.getElementById('trackList');
            const countContainer = document.getElementById('trackCount');
            const today = new Date();
            today.setHours(0, 0, 0, 0); 
            
            let basiFiltrate = basi.filter(b => b.categoria === currentCategory);
            
            const queryPulita = query.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ');
            if (queryPulita) {
                basiFiltrate = basiFiltrate.filter(b => b.stringaRicerca.includes(queryPulita));
            }

            if (isNewsFilterActive) {
                basiFiltrate = basiFiltrate.filter(b => {
                    const bDate = parseScorpioDate(b.data);
                    if(bDate.getTime() !== 0) {
                        const diffTime = today.getTime() - bDate.getTime();
                        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                        return diffDays >= -1 && diffDays <= 5;
                    }
                    return false;
                });
            }

            if (isFavFilterActive) {
                basiFiltrate = basiFiltrate.filter(b => preferiti.includes(b.copiaTesto));
            }

            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'it';
            const testoContatore = (traduzioni[lang] && traduzioni[lang].count_testo) ? traduzioni[lang].count_testo : "Totale basi: ";
            const testoCondividi = (traduzioni[lang] && traduzioni[lang].share_btn) ? traduzioni[lang].share_btn : "Manda";
            const testoCopia = (traduzioni[lang] && traduzioni[lang].copy_btn) ? traduzioni[lang].copy_btn : "Copia";
            
            countContainer.innerText = `${testoContatore} ${basiFiltrate.length}`;
            
            countContainer.classList.remove('pop-anim');
            void countContainer.offsetWidth; 
            countContainer.classList.add('pop-anim');

            if(basiFiltrate.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#ccc; margin-top:30px;'>Nessuna traccia trovata in questa sezione.</p>";
                return;
            }

            const htmlCompleto = basiFiltrate.map(b => {
                let isNews = '';
                const bDate = parseScorpioDate(b.data);
                if(bDate.getTime() !== 0) {
                    const diffTime = today.getTime() - bDate.getTime();
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    if(diffDays >= -1 && diffDays <= 5) {
                        isNews = '<span class="news-tag">NEWS</span>';
                    }
                }
                
                const testoSicuro = b.copiaTesto.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const titoloCondivisione = b.titolo.replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '').trim().replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const favClass = preferiti.includes(b.copiaTesto) ? 'attivo' : '';
                
                return `
                    <div class="track-item">
                        <div class="meta-col">
                            <div class="artist-col">${b.artista}</div>
                            <div class="title-col">
                                <button class="btn-preferito ${favClass}" onclick="window.toggleFav('${testoSicuro}')">★</button> 
                                ${b.titolo} ${isNews} <span class="hq-badge">HQ</span>
                            </div>
                        </div>
                        <button class="copy-btn" onclick="window.copia('${testoSicuro}')">${testoCopia}</button>
                        <button class="share-btn" onclick="window.condividi('${titoloCondivisione}')">
                            <img src="starmaker.png" alt="StarMaker">
                        </button>
                    </div>
                `;
            }).join('');
            
            list.innerHTML = htmlCompleto;
            
            if (queryPulita !== "") {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        let toastTimeout = null;
        function mostraToast(messaggio) {
            const toast = document.getElementById('toastNotifica');
            toast.innerHTML = `<span>✅</span> <span>${messaggio}</span>`;
            toast.classList.add('visibile');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('visibile');
            }, 2600);
        }

            if (window.umami) {
                window.umami.track('Richiesta Brano In-App', { artista: artista, brano: titolo });

        window.copia = function(text) {
            try {
                const nota = document.createElement('div');
                nota.className = 'nota-animata';
                nota.innerText = '🎵';
                const x = (window.event && window.event.clientX) ? window.event.clientX : (window.innerWidth / 2);
                const y = (window.event && window.event.clientY) ? window.event.clientY : (window.innerHeight / 2);
                nota.style.left = (x - 15) + 'px';
                nota.style.top = (y - 30) + 'px';
                document.body.appendChild(nota);
                setTimeout(() => nota.remove(), 800);
            } catch (e) {}

            navigator.clipboard.writeText(text);
            
            if (window.umami) {
                window.umami.track('Copia Brano', { brano: text });
            }
            
            baseCopiesStorage++;
            localStorage.setItem('scorpio_local_copies', baseCopiesStorage);
            aggiornaContatoreCopie();

            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'it';

            else if (lang === 'fr') messaggio = "Piste copiée ! Collez-la sur StarMaker";
            else if (lang === 'de') messaggio = "Playback kopiert! In StarMaker einfügen";
            
            mostraToast(messaggio);
        };

                messaggioToast = "COLLEZ dans Family, groupes, followers... Merci pour l'aide !";
                
            } else if (lang === 'de') {

        window.addEventListener('scroll', () => {

            it: {
