<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAU•SCORPIO•EDITION | Piattaforma Ufficiale</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scorpio Edition">
    <link rel="apple-touch-icon" href="logo_scorpio.png">
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; background-image: url('logo_scorpio.png'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); z-index: -1; }
        
        .navbar-fissa { position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; height: 60px; background: rgba(13, 13, 13, 0.98); z-index: 1000; border-bottom: 2px solid #ffcc00; box-shadow: 0 4px 10px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 15px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .navbar-fissa::-webkit-scrollbar { display: none; }
        
        .navbar-fissa button { background: none; border: none; cursor: pointer; color: #ffffff; font-weight: bold; text-transform: uppercase; font-size: 1em; letter-spacing: 1px; padding: 10px 15px; transition: color 0.2s; border-bottom: 2px solid transparent; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
        .navbar-fissa button:hover { color: #ffcc00; }
        .navbar-fissa button.attivo { color: #ffcc00; border-bottom: 2px solid #ffcc00; }
        
        .pagina { display: none; padding: 80px 20px 100px 20px; max-width: 900px; margin: auto; min-height: 100vh; box-sizing: border-box; }
        .pagina.attiva { display: block; }
        .pagina h2 { color: #ffcc00; text-transform: uppercase; font-size: 2em; margin-bottom: 20px; text-align: center;}
        .pagina h3 { color: #ffcc00; text-transform: uppercase; font-size: 1.5em; text-align: center; margin-top: 20px; margin-bottom: 20px;}
        .pagina blockquote { border-left: 4px solid #ffcc00; padding-left: 20px; font-style: italic; color: #ccc; margin: 20px 0; font-size: 1.1em; }
        .pagina ul { list-style-type: square; padding-left: 20px; }
        .pagina li { margin-bottom: 10px; color: #ddd; }
        .pagina p { line-height: 1.6; color: #eee; }
        
        .sticky-header { position: sticky; top: 62px; background: rgba(0, 0, 0, 0.95); z-index: 990; padding: 15px 0; border-bottom: 2px solid #ffcc00; margin-bottom: 20px; }
        .search-box { width: 100%; padding: 15px; border-radius: 5px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 1.1em; box-sizing: border-box; margin-top: 10px; -webkit-appearance: none; }

        input[type="search"]::-webkit-search-cancel-button {
            -webkit-appearance: searchfield-cancel-button !important;
            display: inline-block !important;
            opacity: 1 !important;
        }
        
        .track-item { display: grid; grid-template-columns: 1fr 2fr 100px 110px; align-items: center; gap: 15px; padding: 14px; border-bottom: 1px solid #333; background: rgba(0, 0, 0, 0.6); margin-bottom: 5px; border-radius: 4px; }
        
        .meta-col { display: contents; }
        
        .artist-col { text-align: left; color: #ffcc00; font-size: 0.95em; text-transform: uppercase; font-weight: bold; border-right: 1px solid #444; padding-right: 10px; }
        .title-col { text-align: center; color: #ffffff; font-weight: bold; font-size: 1.1em; }
        
        .copy-btn { background: #ffcc00; border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 3px; color: #000; text-transform: uppercase; font-size: 0.9em; width: 100%; text-align: center; }
        
        .share-btn { background: #25D366; border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 3px; color: #fff; text-transform: uppercase; font-size: 0.9em; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; transition: background 0.2s; }
        .share-btn:hover { background: #20ba5a; }
        .share-btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
        
        .filter-group { display: flex; justify-content: center; gap: 10px; margin-top: 10px; margin-bottom: 5px; flex-wrap: wrap; }
        .filter-btn { background: transparent; border: 1px solid #ffcc00; color: #ffcc00; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85em; text-transform: uppercase; transition: all 0.2s; }
        .filter-btn:hover { background: rgba(255, 204, 0, 0.15); }
        .filter-btn.active { background: #ffcc00; color: #000; box-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }

        #backToTopBtn { position: fixed; bottom: 30px; right: 30px; display: none; z-index: 999; background: rgba(0, 0, 0, 0.8); border: 2px solid #ffcc00; color: #ffcc00; border-radius: 50%; width: 50px; height: 50px; font-size: 1.5em; cursor: pointer; transition: background 0.3s, transform 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        #backToTopBtn:hover { background: rgba(255, 204, 0, 0.2); transform: scale(1.1); }

        .hq-badge { background: linear-gradient(45deg, #ffcc00, #ff9900); color: #000; font-size: 0.65em; padding: 3px 6px; border-radius: 4px; font-weight: bold; margin-left: 8px; vertical-align: middle; border: 1px solid #333; box-shadow: 0 0 5px rgba(255,204,0,0.4); }
        
        .news-tag { background: #ffcc00; color: #000; font-size: 0.75em; padding: 3px 8px; border-radius: 3px; font-weight: bold; margin-left: 10px; vertical-align: middle; }
        
        .messaggio-errore { color: #ff4444; text-align: center; font-weight: bold; padding: 20px; border: 1px solid #ff4444; border-radius: 5px; background: rgba(255, 0, 0, 0.1); margin-top: 20px; }
        
        .copy-counter-widget { position: fixed; bottom: 30px; left: 30px; background: rgba(15, 15, 15, 0.9); border: 1px solid rgba(255, 204, 0, 0.3); color: #ccc; padding: 8px 18px; border-radius: 30px; font-size: 0.85em; z-index: 998; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 8px; backdrop-filter: blur(5px); }
        .copy-counter-widget span#copyWidgetNum { color: #ffcc00; font-weight: bold; font-size: 1.1em; letter-spacing: 0.5px; }
        .copy-counter-widget svg { width: 16px; height: 16px; fill: #ffcc00; }
        
        @keyframes pulse-gold {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
            50% { transform: scale(1.08); box-shadow: 0 0 20px rgba(255,204,0,0.8); border-color: #ffcc00; }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        }
        .pulse-anim { animation: pulse-gold 0.4s ease; }

        @media (max-width: 600px) {
            .navbar-fissa { height: 55px; justify-content: flex-start; padding: 0 10px; }
            .navbar-fissa button { font-size: 0.85em; padding: 8px 5px; }
            .sticky-header { top: 57px; padding: 10px 0; margin-bottom: 10px; } 
            .search-box { padding: 12px; margin-top: 5px; }
            
            .track-item { grid-template-columns: 1fr auto auto; text-align: left; gap: 10px; padding: 10px; width: 100%; box-sizing: border-box; }
            .meta-col { display: flex; flex-direction: column; gap: 4px; text-align: left; overflow: hidden; min-width: 0; }
            
            .artist-col { border-right: none; padding-right: 0; text-align: left; font-size: 0.8em; line-height: 1.2; word-wrap: break-word; overflow-wrap: break-word; }
            .title-col { text-align: left; font-size: 0.95em; line-height: 1.2; word-wrap: break-word; overflow-wrap: break-word; }
            
            .copy-btn, .share-btn { width: auto; padding: 10px 12px; font-size: 0.8em; height: 38px; }
            .share-btn span { display: none; }
            #backToTopBtn { bottom: 20px; right: 20px; width: 45px; height: 45px; font-size: 1.3em; }
            
            .copy-counter-widget { bottom: 20px; left: 15px; padding: 6px 12px; font-size: 0.75em; }
            .copy-counter-widget svg { width: 14px; height: 14px; }
        }
    </style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="5b9047a4-c276-426b-8fa8-ceef3d41a2cd"></script>
</head>
<body>

    <div class="navbar-fissa">
        <button id="btn1" onclick="window.cambiaPagina('menu1', this)">Home</button>
        <button id="btn2" onclick="window.cambiaPagina('menu2', this)">Video Guida</button>
        <button id="btn3" class="attivo" onclick="window.cambiaPagina('catalogo', this)">Catalogo</button>
        <button id="btn5" onclick="window.cambiaPagina('menu5', this)">Contatti</button>
    </div>

    <div id="menu1" class="pagina">
        <div id="manifesto-content"></div>
        <div class="vetrina-container" id="vetrina-novita" style="display:none;">
            <div class="vetrina-title" id="vetrinaTitleText">🔥 Ultimi Arrivi in Studio</div>
            <div id="vetrina-list"></div>
        </div>
    </div>
    
    <div id="menu2" class="pagina">
        <h2 id="video-guida-title" style="text-align: center; color: #ffcc00; font-family: sans-serif; margin-bottom: 15px; text-transform: uppercase;"></h2>
        
        <div id="guida-video-container" style="max-width: 380px; margin: 0 auto 30px auto; padding: 10px;">
            <div style="padding:100% 0 0 0; position:relative; border: 2px solid #ffcc00; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(255,204,0,0.3); background: #000;">
                <iframe src="https://player.vimeo.com/video/1200711710?badge=0&autopause=0&player_id=0&app_id=58479&muted=0&transparent=0" 
                        frameborder="0" 
                        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" 
                        loading="lazy"
                        style="position:absolute;top:0;left:0;width:100%;height:100%;" 
                        title="guida scorpio edition">
                </iframe>
            </div>
        </div>
        <div id="guida-content"></div>
    </div>
    
    <div id="catalogo" class="pagina attiva">
        <div class="sticky-header">
            <h2 id="catalogo-title">Archivio Ufficiale</h2>
            <div id="trackCount" style="text-align: center; color: #ffcc00; font-weight: bold; font-size: 1.1em; margin-bottom: 5px;"></div>
            
            <div class="filter-group">
                <button id="btnCatKaraoke" class="filter-btn active" onclick="setCategory('KARAOKE')">🎤 Karaoke</button>
                <button id="btnCatInediti" class="filter-btn" onclick="setCategory('INEDITI')">🎧 Inediti</button>
                <button id="btnCatBasiInediti" class="filter-btn" onclick="setCategory('BASI_INEDITI')">🎙️ Basi Inediti</button>
            </div>
            
            <div class="filter-group">
                <button id="btnFilterAll" class="filter-btn active" onclick="setFilter(false)">📂 Mostra Tutto</button>
                <button id="btnFilterNews" class="filter-btn" onclick="setFilter(true)">🔥 Novità (5 gg)</button>
            </div>

            <input type="search" id="searchInput" class="search-box" placeholder="Cerca...">
        </div>
        <div id="trackList">
            <p style="text-align: center; color: #ffcc00;">Caricamento database in corso...</p>
        </div>
    </div>
    
    <div id="menu5" class="pagina">
        <div id="contatti-content"></div>
        <div style="text-align: center; margin-top: 30px;">
            <p id="testo-qr" style="color: #ccc; font-style: italic; margin-bottom: 10px;"></p>
            <img src="qr_whatsapp.jpg" alt="WhatsApp QR Code" style="max-width: 200px; border: 2px solid #ffcc00; border-radius: 10px; box-shadow: 0 0 15px rgba(255,204,0,0.3);">
        </div>
    </div>

    <div id="copyCounterWidget" class="copy-counter-widget">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        <span id="copyWidgetText">Copie:</span>
        <span id="copyWidgetNum">0</span>
    </div>

    <button id="backToTopBtn" onclick="window.scrollToTop()">▲</button>

    <script>
        window.cambiaPagina = function(idPagina, tastoCliccato) {
            document.querySelectorAll('.pagina').forEach(pag => pag.classList.remove('attiva'));
            document.getElementById(idPagina).classList.add('attiva');
            document.querySelectorAll('.navbar-fissa button').forEach(btn => btn.classList.remove('attivo'));
            if(tastoCliccato) tastoCliccato.classList.add('attivo');
            window.scrollTo(0, 0);
        };

        let basi = [];
        let isNewsFilterActive = false;
        let currentCategory = 'KARAOKE'; 

        let baseCopiesStorage = parseInt(localStorage.getItem('scorpio_local_copies') || '0');
        
        function aggiornaContatoreCopie() {
            let timeFactor = Math.floor((Date.now() - new Date("2025-01-01").getTime()) / (1000 * 60 * 15));
            let totalCopies = 14500 + timeFactor + baseCopiesStorage;
            
            document.getElementById('copyWidgetNum').innerText = totalCopies.toLocaleString('it-IT');
            
            const widget = document.getElementById('copyCounterWidget');
            widget.classList.remove('pulse-anim');
            void widget.offsetWidth; 
            widget.classList.add('pulse-anim');
        }

        function parseScorpioDate(dateString) {
            if (!dateString) return new Date(0);
            const str = dateString.trim().replace(/\s+/g, '');
            const parti = str.split(/[-/]/);
            if (parti.length >= 3) {
                let p0 = parti[0];
                let p1 = parti[1];
                let p2 = parti[2];
                let anno = p2.length === 4 ? p2 : p0;
                let giorno = p2.length === 4 ? p0 : p2;
                return new Date(parseInt(anno, 10), parseInt(p1, 10) - 1, parseInt(giorno, 10));
            }
            return new Date(0);
        }

        async function caricaDatabase() {
            try {
                const response = await fetch('scorpio_database.json');
                
                if (!response.ok) {
                    throw new Error("File scorpio_database.json non trovato.");
                }
                
                const dataJson = await response.json();
                
                const pulisci = (t) => t.toLowerCase().replace(/[\u200B-\u200D\uFEFF\u200E\u200F]/g, '').replace(/\s+/g, ' ');
                
                basi = dataJson.map(b => ({
                    ...b,
                    stringaRicerca: pulisci((b.titolo || '') + ' ' + (b.artista || '') + ' ' + (b.copiaTesto || ''))
                }));
                
                basi.sort((a, b) => {
                    let cmpArtista = a.artista.localeCompare(b.artista);
                    if (cmpArtista !== 0) return cmpArtista;
                    return a.titolo.localeCompare(b.titolo);
                });

                renderVetrina();

                const params = new URLSearchParams(window.location.search);
                const searchParam = params.get('search') || '';
                if (searchParam) {
                    document.getElementById('searchInput').value = searchParam;
                }
                renderTracks(searchParam);
                
            } catch (error) {
                console.error("Errore:", error);
                document.getElementById('trackList').innerHTML = `
                    <div class="messaggio-errore">
                        Impossibile caricare l'archivio basi (scorpio_database.json).<br><br>
                        Assicurati che il file sia presente sul server o nella cartella locale.
                    </div>
                `;
            }
        }

        function renderVetrina() {
            const list = document.getElementById('vetrina-list');
            const vetrinaContainer = document.getElementById('vetrina-novita');
            
            const basiRecenti = [...basi].sort((a, b) => parseScorpioDate(b.data) - parseScorpioDate(a.data)).slice(0, 3);
            
            if(basiRecenti.length > 0) {
                vetrinaContainer.style.display = 'block';
                const params = new URLSearchParams(window.location.search);
                const lang = params.get('lang') || 'it';
                const testoCondividi = (traduzioni[lang] && traduzioni[lang].share_btn) ? traduzioni[lang].share_btn : "Manda";
                const testoCopia = (traduzioni[lang] && traduzioni[lang].copy_btn) ? traduzioni[lang].copy_btn : "Copia";

                const htmlVetrina = basiRecenti.map(b => {
                    const testoSicuro = b.copiaTesto.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                    const titoloCondivisione = b.titolo.replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '').trim().replace(/'/g, "\\'").replace(/"/g, "&quot;");
                    
                    return `
                        <div class="track-item">
                            <div class="meta-col">
                                <div class="artist-col">${b.artista}</div>
                                <div class="title-col">${b.titolo} <span class="news-tag">NEWS</span> <span class="hq-badge">HQ</span></div>
                            </div>
                            <button class="copy-btn" onclick="window.copia('${testoSicuro}')">${testoCopia}</button>
                            <button class="share-btn" onclick="window.condividi('${titoloCondivisione}')">
                                <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.586 4.391 1.696 6.356l-.999 3.648 3.792-.995zm11.234-7.116c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg><span>${testoCondividi}</span>
                            </button>
                        </div>
                    `;
                }).join('');
                
                list.innerHTML = htmlVetrina;
            }
        }

        window.setCategory = function(cat) {
            currentCategory = cat;
            document.getElementById('btnCatKaraoke').classList.toggle('active', cat === 'KARAOKE');
            document.getElementById('btnCatInediti').classList.toggle('active', cat === 'INEDITI');
            document.getElementById('btnCatBasiInediti').classList.toggle('active', cat === 'BASI_INEDITI');
            renderTracks(document.getElementById('searchInput').value);
        };

        window.setFilter = function(isNews) {
            isNewsFilterActive = isNews;
            if(isNews) {
                document.getElementById('btnFilterNews').classList.add('active');
                document.getElementById('btnFilterAll').classList.remove('active');
            } else {
                document.getElementById('btnFilterNews').classList.remove('active');
                document.getElementById('btnFilterAll').classList.add('active');
            }
            renderTracks(document.getElementById('searchInput').value);
        };

        function renderTracks(query = "") {
            const list = document.getElementById('trackList');
            const countContainer = document.getElementById('trackCount');
            const today = new Date();
            today.setHours(0, 0, 0, 0); 
            
            let basiFiltrate = basi.filter(b => b.categoria === currentCategory);
            
            const queryPulita = query.trim().replace(/\s+/g, ' ').toLowerCase();
            if (queryPulita) {
                basiFiltrate = basiFiltrate.filter(b => b.stringaRicerca.includes(queryPulita));
            }

            if (isNewsFilterActive) {
                basiFiltrate = basiFiltrate.filter(b => {
                    const bDate = parseScorpioDate(b.data);
                    if(bDate.getTime() !== 0) {
                        const diffTime = today.getTime() - bDate.getTime();
                        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                        return diffDays >= -1 && diffDays <= 5;
                    }
                    return false;
                });
            }

            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'it';
            const testoContatore = (traduzioni[lang] && traduzioni[lang].count_testo) ? traduzioni[lang].count_testo : "Totale basi: ";
            const testoCondividi = (traduzioni[lang] && traduzioni[lang].share_btn) ? traduzioni[lang].share_btn : "Manda";
            const testoCopia = (traduzioni[lang] && traduzioni[lang].copy_btn) ? traduzioni[lang].copy_btn : "Copia";
            
            countContainer.innerText = `${testoContatore} ${basiFiltrate.length}`;

            if(basiFiltrate.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#ccc; margin-top:30px;'>Nessuna traccia trovata in questa sezione.</p>";
                return;
            }

            const htmlCompleto = basiFiltrate.map(b => {
                let isNews = '';
                const bDate = parseScorpioDate(b.data);
                if(bDate.getTime() !== 0) {
                    const diffTime = today.getTime() - bDate.getTime();
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    if(diffDays >= -1 && diffDays <= 5) {
                        isNews = '<span class="news-tag">NEWS</span>';
                    }
                }
                
                const testoSicuro = b.copiaTesto.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const titoloCondivisione = b.titolo.replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '').trim().replace(/'/g, "\\'").replace(/"/g, "&quot;");
                
                return `
                    <div class="track-item">
                        <div class="meta-col">
                            <div class="artist-col">${b.artista}</div>
                            <div class="title-col">${b.titolo} ${isNews} <span class="hq-badge">HQ</span></div>
                        </div>
                        <button class="copy-btn" onclick="window.copia('${testoSicuro}')">${testoCopia}</button>
                        <button class="share-btn" onclick="window.condividi('${titoloCondivisione}')">

                m_content: `<h2>MAU•SCORPIO•EDITION: Your voice deserves respect.</h2>
